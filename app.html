<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>if(/(^|\.)github\.io$/.test(location.hostname))location.replace("https://james84.vercel.app/"+location.pathname.replace(/^\/James\/?/,"")+(location.search||"")+(location.hash||""));</script>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#07080A"/>
  <title>DropPilot</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"/>
  <style>
    /* @brand-tokens — KEEP IN SYNC WITH index.html, privacy.html, terms.html, AND the JS C object below */
    :root{
      --bg:#07080A; --s1:#0D0F13; --s2:#12151A; --s3:#1A1E26;
      --amber:#F5A623; --amber-d:#C8820A; --amber-l:#ffc84a;
      --green:#10B981; --blue:#3B82F6; --purple:#8B5CF6; --teal:#06B6D4; --red:#F43F5E;
      --text:#EDF0F7; --text2:#8B95A8; --text3:#6B7A8D;
      --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-full:9999px;
      --ease-out:cubic-bezier(0.22,1,0.36,1);
      --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
      --sans:'Outfit',system-ui,sans-serif;
      --display:'Bebas Neue','Outfit',sans-serif;
      --mono:'JetBrains Mono','Courier New',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);}
    @keyframes lFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.03)}}
    #splash{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:var(--sans);}
    #splash .s-icon{
      display:flex;align-items:center;justify-content:center;
      width:52px;height:52px;border-radius:var(--r-lg);
      background:linear-gradient(135deg,var(--amber),var(--amber-d));
      box-shadow:0 0 0 1px rgba(245,166,35,0.20),0 4px 14px rgba(245,166,35,0.30),0 14px 40px rgba(245,166,35,0.32),0 28px 80px rgba(245,166,35,0.20);
      animation:lFloat 2s ease-in-out infinite;
      filter:drop-shadow(0 0 18px rgba(245,166,35,0.45));
    }
    #splash .s-msg{color:var(--amber);font-size:17px;font-weight:800;letter-spacing:-0.3px;text-shadow:0 0 24px rgba(245,166,35,0.35);}
  </style>
</head>
<body>
  <div id="root">
    <div id="splash">
      <div class="s-icon"><svg width="28" height="28" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M1 10 L3 6 L8 4 L10 2 L12 4 L17 6 L19 10 L17.5 18 L2.5 18 Z" fill="white"/><path d="M10 2 L10 18" stroke="white" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/><path d="M8 4 L12 4" stroke="white" stroke-width="1" opacity="0.6" stroke-linecap="round"/></svg></div>
      <div class="s-msg">DropPilot · Customer Service for Gig Drivers</div>
    </div>
  </div>
  <script src="/vendor/react.min.js"></script>
  <script src="/vendor/react-dom.min.js"></script>
  <script src="content-en1.js"></script>
  <script src="content-en2.js"></script>
  <script src="content-es1.js"></script>
  <script src="content-es2.js"></script>
  <!-- app.bundle.js is precompiled from app1.jsx + app2.jsx by `npm run build`
       (replaces the old in-browser Babel transpile — see tools/build.mjs). -->
  <script defer src="app.bundle.js"></script>
  <script>
  // Offline support for in-car use. The worker never touches /api/* or
  // ?session_id= navigations, so Stripe checkout and payment verification
  // always hit the network (see sw.js).
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
  </script>
</body>
</html>
