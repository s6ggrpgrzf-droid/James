<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>TESTING</title></head>
<body>
<div id="root"></div>
<script>
// Capture the App error before anything else
window.__appError = null;
var _origError = console.error;
console.error = function(){
  var args = Array.prototype.slice.call(arguments);
  if(args[0] === "DropPilot error:" && args[1]){
    window.__appError = String(args[1] && args[1].message || args[1]).slice(0,120);
  }
  return _origError.apply(console, arguments);
};
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="content-en1.js"></script>
<script src="content-en2.js"></script>
<script src="content-es1.js"></script>
<script src="content-es2.js"></script>
<script>
(async function(){
  document.title = "FETCHING";
  try{
    var r = await Promise.all([fetch("app1.jsx").then(x=>x.text()), fetch("app2.jsx").then(x=>x.text())]);
    document.title = "TRANSFORMING";
    var out = Babel.transform(r[0]+"\n;\n"+r[1], {presets:["react","env"]}).code;
    document.title = "EVALING";
    (0,eval)(out);
    setTimeout(function(){
      var root = document.getElementById("root");
      var txt = root.innerText || "";
      if(window.__appError){
        document.title = "APPERR: " + window.__appError;
      } else if(txt.indexOf("Something went wrong") >= 0){
        document.title = "BOUNDARY-NO-DETAILS";
      } else if(txt.length > 100){
        document.title = "RENDERED-OK: " + txt.slice(0,60).replace(/\s+/g," ");
      } else {
        document.title = "EMPTY: " + txt.slice(0,60);
      }
    }, 4000);
  }catch(e){
    document.title = "ERROR: " + String(e.message||e).slice(0,80);
  }
})();
</script>
</body></html>
