<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>TESTING</title></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="content-en1.js"></script>
<script src="content-en2.js"></script>
<script src="content-es1.js"></script>
<script src="content-es2.js"></script>
<script>
(async function(){
  document.title = "FETCHING";
  try{
    var r = await Promise.all([fetch("app1.jsx").then(x=>x.text()), fetch("app2.jsx").then(x=>x.text())]);
    document.title = "TRANSFORMING";
    var out = Babel.transform(r[0]+"\n;\n"+r[1], {presets:["react","env"]}).code;
    document.title = "EVALING";
    (0,eval)(out);
    // Wait 3s for React to render
    setTimeout(function(){
      var root = document.getElementById("root");
      var txt = root.innerText || "";
      if(txt.length > 100){
        document.title = "RENDERED: " + txt.slice(0,80).replace(/\s+/g," ");
      } else {
        document.title = "EMPTY: root has " + root.childNodes.length + " children, text len " + txt.length;
      }
    }, 3000);
  }catch(e){
    document.title = "ERROR: " + String(e.message||e).slice(0,80);
  }
})();
</script>
</body></html>
