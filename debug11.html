<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>TESTING</title></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="content-en1.js"></script>
<script src="content-en2.js"></script>
<script src="content-es1.js"></script>
<script src="content-es2.js"></script>
<script>
// Pre-set language to Spanish BEFORE app loads
try { localStorage.setItem("dp3-lang", JSON.stringify("es")); } catch(e){}
// Skip intro so we get to the main app immediately
try { localStorage.setItem("dp3-intro-seen", JSON.stringify(true)); } catch(e){}

window.addEventListener("error",function(e){ document.title="APPERR: "+String((e.error&&e.error.message)||e.message).slice(0,80); },{once:false});
window.addEventListener("unhandledrejection",function(e){ document.title="REJ: "+String((e.reason&&e.reason.message)||e.reason).slice(0,80); });

document.title="LOADING";
Promise.all([fetch("app1.jsx").then(r=>r.text()),fetch("app2.jsx").then(r=>r.text())]).then(function(parts){
  document.title="TRANSFORMING";
  var out1=Babel.transform(parts[0],{presets:["react"]}).code;
  var out2=Babel.transform(parts[1],{presets:["react"]}).code;
  document.title="EVALING";
  (0,eval)(out1+"\n;\n"+out2);
  // After render, check for Spanish text
  setTimeout(function(){
    var bodyText = document.body.innerText || "";
    var hasSpanish = /Ganar|Mensajes|Capacitación|Básicos|Defensa/.test(bodyText);
    var hasEnglish = /Earn.*Free|Scripts.*Elite/.test(bodyText);
    // Check the lang toggle button state
    var langBtn = Array.from(document.querySelectorAll("button")).find(b=>/ES|EN/.test(b.innerText) && b.innerText.length<5);
    document.title = "ES-TEST: spanish=" + hasSpanish + " langBtn=" + (langBtn?langBtn.innerText:"none") + " bodyLen=" + bodyText.length;
  }, 4000);
}).catch(function(err){ document.title="LOADERR: "+String(err&&err.message||err).slice(0,80); });
</script>
</body></html>
