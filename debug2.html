<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>Debug2</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:20px;white-space:pre-wrap">
<div id="log">LOADING...
</div>
<div id="root"></div>
<script>
function log(m){document.getElementById('log').textContent+=m+"\n";document.title="DBG2 "+String(m).slice(0,50);}
window.onerror=function(m,s,l){log("WINERR: "+m+" @"+s+":"+l);};
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="content-en1.js"></script>
<script src="content-en2.js"></script>
<script src="content-es1.js"></script>
<script src="content-es2.js"></script>
<script>
async function run(){
  log("React="+typeof React+" ReactDOM="+typeof ReactDOM+" Babel="+typeof Babel);
  for(const f of ["app1.jsx","app2.jsx"]){
    try{
      log("Fetching "+f+"...");
      const r=await fetch(f); const src=await r.text();
      log(f+" fetched "+src.length+" chars");
      let out;
      try{ out=Babel.transform(src,{presets:["react","env"]}).code; }
      catch(te){ log(f+" BABEL TRANSFORM FAIL: "+te.message); continue; }
      log(f+" transpiled "+out.length+" chars");
      try{ (0,eval)(out); log(f+" EXEC OK"); }
      catch(ee){ log(f+" EXEC FAIL: "+ee.message); log("STACK: "+(ee.stack||"").split("\n").slice(0,4).join(" | ")); }
    }catch(e){ log(f+" FETCH FAIL: "+e.message); }
  }
  log("App="+typeof App+" ErrorBoundary="+typeof ErrorBoundary);
  try{
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary,null,React.createElement(App)));
    log("RENDER CALL OK");
  }catch(e){ log("RENDER FAIL: "+e.message); }
  setTimeout(function(){
    log("root children="+document.getElementById("root").childNodes.length);
    log("root text: "+document.getElementById("root").innerText.slice(0,300));
    document.title="DBG2-DONE";
  },6000);
}
run();
</script>
</body></html>
